[build-system]
requires = [
  "setuptools>=68",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "indexedlinkedlist"
version = "0.1.0"
description = "Indexed linked list data structure with O(1) index access and linked semantics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Louis Goodnews", email = "louisgoodnews95@gmail.com" }
]
keywords = [
  "data-structures",
  "linked-list",
  "indexing",
  "python",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/louisgoodnews/IndexedLinkedList"
Repository = "https://github.com/louisgoodnews/IndexedLinkedList.git"
Issues = "https://github.com/louisgoodnews/IndexedLinkedList/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["indexedlinkedlist*"]
